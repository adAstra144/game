name: build
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SFML dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenal-dev libflac-dev libvorbis-dev

      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp -r assets dist/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/Release/game.exe dist/
          else
            cp build/game dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
